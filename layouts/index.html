{{ define "main" }}
{{ partial "header.html" . }}
<h1>{{ .Title }}</h1>
{{ .Content }}

<h2 id="blog">Blog</h2>
<main class="posts">
    {{ range .Site.RegularPages }}
    <article>
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}">{{ .Date.Format "January 2006" }}</time>
        <a href="{{ .Permalink }}">{{ .Title }}</a>
    </article>
    {{ end }}
</main>
{{ end }}
